  const yearTxt = el("text", { x: G.right + 52, y: G.bottom - 14, "text-anchor": "end", "font-size": 64, "font-weight": 700, fill: D.c.axis, "font-variant-numeric": "tabular-nums" }, chrome);
  const layers = {};
  for (const f of ["X", "M"]) {
    const L = el("g", { opacity: 0 }, root); L.style.transition = reduce ? "none" : "opacity .45s";
    const bars = {};
    for (const p of D.flows[f].partners) {
      const g = el("g", {}, L); g.style.transition = reduce ? "none" : "opacity .3s";
      const r = el("rect", { x: G.left, y: 0, height: G.rowH * G.bar, rx: 2, fill: p.color }, g);
      const nm = el("text", { x: G.left - 10, y: G.rowH * G.bar / 2 + 4.5, "text-anchor": "end", "font-size": 13.5, fill: D.c.text }, g);
      const val = el("text", { y: G.rowH * G.bar / 2 + 4.5, "font-size": 13, fill: D.c.text, "font-variant-numeric": "tabular-nums" }, g);
      const hit = el("rect", { x: 0, y: -G.rowH * (1 - G.bar) / 2, width: G.right + 40, height: G.rowH, fill: "transparent" }, g);
      hit.addEventListener("mousemove", ev => showTip(ev, f, p));
      hit.addEventListener("mouseleave", () => tip.style.opacity = 0);
      bars[p.iso] = { g, r, nm, val, p };
    }
    layers[f] = { L, bars };
  }
  const ann = el("g", {}, root);
  let cur = { flow: "X", t: Y0 };

  function showTip(ev, f, p) {
    const y = Math.round(cur.t), i = y - Y0;
    const rank = p.rank[i];
    const box = wrap.getBoundingClientRect();
    const grp = (p.group === "ASEAN" || p.group === "EU") ? " (" + groupName(p.group) + ")" : "";
    tip.innerHTML = "<b>" + nameOf(p) + grp + "</b>, " + y + "<br>" + pct(p.share[i]) + " " + T[lang].ofFlow[f] +
      (rank < 900 ? ", " + T[lang].rank + " " + rank : "");
    tip.style.left = clamp(ev.clientX - box.left + 14, 0, box.width - 200) + "px";
    tip.style.top = (ev.clientY - box.top + 14) + "px";
    tip.style.opacity = 1;
  }

  function sample(p, t) {
    const i0 = clamp(Math.floor(t) - Y0, 0, NY - 1), i1 = clamp(i0 + 1, 0, NY - 1), fr = clamp(t - Y0 - i0, 0, 1);
    const r0 = Math.min(p.rank[i0], G.TOP + 2), r1 = Math.min(p.rank[i1], G.TOP + 2);
    return { share: lerp(p.share[i0], p.share[i1], fr), rank: lerp(r0, r1, ease(fr)), shown: p.share[Math.round(t) - Y0] };
  }

  function update(s) {
    cur = s;
    const tx = T[lang];
    title.textContent = tx.flowTitle[s.flow];
    sub.textContent = tx.flowSub[s.flow];
    grid.querySelectorAll("text").forEach(t => t.textContent = fmt(+t.dataset.v, 0) + "%");
    yearTxt.textContent = Math.round(s.t);
    chrome.setAttribute("opacity", s.lines ? 0 : 1);
    for (const f of ["X", "M"]) layers[f].L.setAttribute("opacity", f === s.flow && !s.lines ? 1 : 0);
    const B = layers[s.flow].bars, pos = {};
    for (const iso in B) {
      const b = B[iso], v = sample(b.p, s.t);
      const y = G.top + (v.rank - 1) * G.rowH + G.rowH * (1 - G.bar) / 2;
      const vis = clamp(G.TOP + 1 - v.rank, 0, 1);
      const dim = s.hl && !s.hl.includes(iso) ? .28 : 1;
      b.g.setAttribute("transform", "translate(0," + y.toFixed(2) + ")");
      b.g.setAttribute("opacity", (vis * dim).toFixed(3));
      b.g.style.pointerEvents = vis > .5 ? "auto" : "none";
      const w = Math.max(0, xs(v.share) - G.left);
      b.r.setAttribute("width", w.toFixed(2));
      b.r.setAttribute("stroke", s.ann === "second" && Math.round(v.rank) === 2 ? D.c.text : "none");
      b.r.setAttribute("stroke-width", 1.6);
      b.nm.textContent = nameOf(b.p);
      b.nm.setAttribute("font-weight", s.hl && s.hl.includes(iso) ? 700 : 400);
      b.val.setAttribute("x", (G.left + w + 6).toFixed(2));
      b.val.textContent = pct(v.shown);
      pos[iso] = { y, w, share: v.share, rank: v.rank, shown: v.shown };
    }
    drawAnn(s, pos);
    return pos;
  }

  function drawAnn(s, pos) {
    while (ann.firstChild) ann.removeChild(ann.firstChild);
    if (s.lines || !s.ann) return;
    const tx = T[lang];
    if (s.ann === "pass" && s.flow === "X" && s.t >= D.facts.passYear - .5 && pos.CHN) {
      const c = pos.CHN, yy = c.y + G.rowH * G.bar / 2 + 4.5;
      el("text", { x: G.left + c.w + 62, y: yy, "font-size": 13, "font-style": "italic", fill: D.c.muted }, ann).textContent = tx.passNote;
    }
    if (s.ann === "gap" && s.flow === "M") {
      const sorted = Object.entries(pos).sort((a, b) => a[1].rank - b[1].rank);
      const [a, b] = [sorted[0][1], sorted[1][1]];
      const x1 = G.left + a.w, x2 = G.left + b.w, yb = b.y - (G.rowH * (1 - G.bar)) / 2 + 1;
      const gap = a.shown - b.shown;
      el("line", { x1: x2, x2: x2, y1: b.y, y2: yb - 6, stroke: D.c.text, "stroke-width": 1, "stroke-dasharray": "3 2" }, ann);
      el("line", { x1: x2, x2: x1, y1: yb - 6, y2: yb - 6, stroke: D.c.text, "stroke-width": 1.2 }, ann);
      el("line", { x1: x1, x2: x1, y1: yb - 10, y2: yb - 2, stroke: D.c.text, "stroke-width": 1.2 }, ann);
      el("line", { x1: x2, x2: x2, y1: yb - 10, y2: yb - 2, stroke: D.c.text, "stroke-width": 1.2 }, ann);
      const room = x1 + 8 + 130 < G.W;
      el("text", { x: room ? x1 + 8 : x2 + 58, y: room ? yb - 1 : b.y + G.rowH * G.bar / 2 + 4.5, "font-size": 13, "font-weight": 700, fill: D.c.text,
                   stroke: D.c.bg, "stroke-width": 4, "paint-order": "stroke", "stroke-linejoin": "round" }, ann)
        .textContent = (room ? "" : "\u2190 ") + tx.gapNote.replace("{v}", fmt(gap));
    }
  }
  return { update };
}

// ---------------------------------------------------------------- small multiples of lines (static alternative, closing scene)
function makeLines(svg, tip, wrap) {
  const root = el("g", { opacity: 0 }, svg); root.style.transition = reduce ? "none" : "opacity .45s";
  const P = { top: 84, h: 380, w: 222, gap: 148, x0: 38 };
  const ys = v => P.top + P.h - v / D.axisMax * P.h;
  const panels = [];
  const clipId = "clip" + Math.random().toString(36).slice(2);
  const cp = el("clipPath", { id: clipId }, el("defs", {}, root));
  const clipR = el("rect", { x: 0, y: 0, width: 0, height: 540 }, cp);
  ["X", "M"].forEach((f, k) => {
    const x0 = P.x0 + k * (P.w + P.gap), xs2 = y => x0 + (y - Y0) / (Y1 - Y0) * P.w;
    const g = el("g", {}, root);
    const ttl = el("text", { x: x0 - 34, y: 22, "font-size": 16, "font-weight": 700, fill: D.c.text }, g);
    const sub = el("text", { x: x0 - 34, y: 42, "font-size": 12.5, fill: D.c.muted }, g);
    const yl = [];
    for (let v = 0; v <= D.axisMax - 5; v += 10) {
      el("line", { x1: x0, x2: x0 + P.w, y1: ys(v), y2: ys(v), stroke: v === 0 ? D.c.axis : D.c.grid, "stroke-width": v === 0 ? 1 : .8 }, g);
      const t = el("text", { x: x0 - 8, y: ys(v) + 4, "text-anchor": "end", "font-size": 12, fill: D.c.muted }, g); t.dataset.v = v; yl.push(t);
    }
    for (const y of [2004, 2009, 2014, 2019, 2024]) el("text", { x: xs2(y), y: P.top + P.h + 18, "text-anchor": "middle", "font-size": 12, fill: D.c.muted }, g).textContent = y;
    const lg = el("g", { "clip-path": "url(#" + clipId + ")" }, g);
    const hlSet = D.flows[f].lineHl;
    const ordered = D.flows[f].partners.slice().sort((a, b) => hlSet.includes(a.iso) - hlSet.includes(b.iso));
    const labels = [];
    for (const p of ordered) {
      const on = hlSet.includes(p.iso);
      const d = p.share.map((v, i) => (i ? "L" : "M") + xs2(Y0 + i).toFixed(1) + " " + ys(v).toFixed(1)).join("");
      el("path", { d, fill: "none", stroke: on ? p.color : D.c.grey, "stroke-width": on ? 2.4 : 1, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: on ? 1 : .8 }, lg);
      if (on) labels.push({ p, y: ys(p.share[NY - 1]) });
    }
    // nhãn cuối đường, đẩy ra khi chồng nhau
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 15) labels[i].y = labels[i - 1].y + 15;
    const lab = el("g", { "clip-path": "url(#" + clipId + ")" }, g);
    const labT = labels.map(o => {
      el("circle", { cx: xs2(Y1), cy: ys(o.p.share[NY - 1]), r: 3.2, fill: o.p.color }, lab);
      return { o, t: el("text", { x: xs2(Y1) + 7, y: o.y + 4, "font-size": 12.5, fill: D.c.text }, lab) };
    });
    // chú thích: mốc 2013 (xuất khẩu), khoảng cách đầu và cuối kỳ (nhập khẩu)
    const note = el("g", { "clip-path": "url(#" + clipId + ")" }, g);
    const notes = [];
    if (f === "X") {
      const yP = D.facts.passYear, c = D.flows.X.partners.find(p => p.iso === "CHN");
      const cy = ys(c.share[yP - Y0]);
      el("circle", { cx: xs2(yP), cy, r: 5.5, fill: "none", stroke: D.c.text, "stroke-width": 1.3 }, note);
      el("line", { x1: xs2(yP), x2: xs2(yP), y1: cy - 7, y2: cy - 30, stroke: D.c.text, "stroke-width": 1 }, note);
      notes.push({ t: el("text", { x: xs2(yP) - 4, y: cy - 33, "text-anchor": "end", "font-size": 12, fill: D.c.text, stroke: D.c.bg, "stroke-width": 4, "paint-order": "stroke", "stroke-linejoin": "round" }, note), k: "linePass" });
    } else {
      const c = D.flows.M.partners.find(p => p.iso === "CHN");
      const q = D.flows.M.partners.find(p => p.iso === D.facts.m2_24), q0 = D.flows.M.partners.find(p => p.iso === D.facts.m2_04);
      const xx = xs2(Y1) - 12, top = ys(c.share[NY - 1]), bot = ys(q.share[NY - 1]);
      el("line", { x1: xx, x2: xx, y1: top, y2: bot, stroke: D.c.text, "stroke-width": 1.2 }, note);
      for (const v of [top, bot]) el("line", { x1: xx - 4, x2: xx + 4, y1: v, y2: v, stroke: D.c.text, "stroke-width": 1.2 }, note);
      const halo = { stroke: D.c.bg, "stroke-width": 4, "paint-order": "stroke", "stroke-linejoin": "round" };
      notes.push({ t: el("text", Object.assign({ x: xx - 7, y: ys(q.share[NY - 1] + 8), "text-anchor": "end", "font-size": 12.5, "font-weight": 700, fill: D.c.text }, halo), note),
                   k: "lineGap24", v: c.share[NY - 1] - q.share[NY - 1] });
      notes.push({ t: el("text", Object.assign({ x: xx - 7, y: ys(q.share[NY - 1] + 8) + 16, "text-anchor": "end", "font-size": 12, fill: D.c.muted }, halo), note),
                   k: "lineGap04", v: c.share[0] - q0.share[0] });
    }
    // lớp di chuột: đường dọc theo năm gần nhất
    const cross = el("line", { y1: P.top, y2: P.top + P.h, stroke: D.c.axis, "stroke-width": 1, opacity: 0 }, g);
    const hit = el("rect", { x: x0, y: P.top, width: P.w, height: P.h, fill: "transparent" }, g);
    hit.addEventListener("mousemove", ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
      const y = clamp(Math.round(Y0 + (loc.x - x0) / P.w * (Y1 - Y0)), Y0, Y1), i = y - Y0;
      cross.setAttribute("x1", xs2(y)); cross.setAttribute("x2", xs2(y)); cross.setAttribute("opacity", 1);
      const rows = D.flows[f].partners.filter(p => hlSet.includes(p.iso)).sort((a, b) => b.share[i] - a.share[i])
        .map(p => "<span style='display:inline-block;width:9px;height:9px;border-radius:2px;background:" + p.color + ";margin-right:6px'></span>" + nameOf(p) + ": " + pct(p.share[i])).join("<br>");
      const box = wrap.getBoundingClientRect();
      tip.innerHTML = "<b>" + y + "</b>, " + T[lang].flowShort[f] + "<br>" + rows;
      tip.style.left = clamp(ev.clientX - box.left + 14, 0, box.width - 200) + "px";
      tip.style.top = (ev.clientY - box.top + 14) + "px"; tip.style.opacity = 1;
    });
    hit.addEventListener("mouseleave", () => { tip.style.opacity = 0; cross.setAttribute("opacity", 0); });
    panels.push({ f, ttl, sub, yl, labT, notes });
  });
  function update(s) {
    root.setAttribute("opacity", s.lines ? 1 : 0);
    root.style.pointerEvents = s.lines ? "auto" : "none";
    clipR.setAttribute("width", (s.lines ? 30 + s.p * 730 : 0).toFixed(1));
    const tx = T[lang];
    for (const pn of panels) {
      pn.ttl.textContent = tx.flowShort[pn.f]; pn.sub.textContent = tx.lineSub;
      pn.yl.forEach(t => t.textContent = fmt(+t.dataset.v, 0) + "%");
      pn.labT.forEach(({ o, t }) => t.textContent = nameOf(o.p) + " " + pct(o.p.share[NY - 1]));
      pn.notes.forEach(n => n.t.textContent = tx[n.k].replace("{v}", n.v !== undefined ? fmt(n.v) : ""));
    }
  }
  return { update };
}

// ---------------------------------------------------------------- page text, legend, language
function legend(box, flow) {
  const ps = flow === "lines" ? D.flows.X.partners.filter(p => D.flows.X.lineHl.includes(p.iso)).concat(D.flows.M.partners.filter(p => D.flows.M.lineHl.includes(p.iso)))
                              : D.flows[flow].partners;
  const present = D.groupOrder.filter(g => ps.some(p => p.group === g));
  box.innerHTML = present.map(g => "<span><i style='background:" + D.groups[g].color + "'></i>" + groupName(g) + "</span>").join("");
}
function applyText() {
  document.documentElement.lang = lang;
  document.title = T[lang].pageTitle;
  document.querySelectorAll("[data-k]").forEach(e => e.textContent = T[lang][e.dataset.k]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("#flowSeg button").forEach(b => b.textContent = T[lang].flowShort[b.dataset.flow]);
  stepsBox.innerHTML = "";
  T[lang].steps.forEach((st, i) => {
    const d = document.createElement("div");
    d.className = "step" + (D.scenes[i].y0 !== D.scenes[i].y1 || D.scenes[i].lines ? " scrub" : "");
    d.innerHTML = "<div class='inner'><div class='yr'>" + st.kicker + "</div><h2>" + st.h + "</h2>" + st.p.map(x => "<p>" + x + "</p>").join("") +
      (st.hint ? "<p class='hint'>" + st.hint + "</p>" : "") + "</div>";
    stepsBox.appendChild(d);
  });
  steps = Array.from(stepsBox.children);
  document.getElementById("chart-desc").textContent = T[lang].chartDesc;
  document.getElementById("chart2-desc").textContent = T[lang].chartDesc;
  playBtn.textContent = playing ? T[lang].pause : T[lang].play;
  lastActive = -1; target = null; tick(true);
  ex.render();
}
const stepsBox = document.getElementById("steps");
let steps = [];

// ---------------------------------------------------------------- scroll-driven state
const race = makeRace(document.getElementById("chart"), document.getElementById("tip"), document.getElementById("figwrap"));
const lines = makeLines(document.getElementById("chart"), document.getElementById("tip"), document.getElementById("figwrap"));
let shown = { flow: D.scenes[0].flow, t: D.scenes[0].y0, p: 0 }, target = null, lastActive = -1, legendFlow = null, lastLive = "";

function readScroll() {
  const vh = window.innerHeight, mark = vh * (window.innerWidth < 820 ? 0.85 : 0.55);
  let idx = 0;
  steps.forEach((s, i) => { if (s.getBoundingClientRect().top < mark) idx = i; });
  const r = steps[idx] ? steps[idx].getBoundingClientRect() : { top: 0, height: 1 };
  const raw = clamp((mark - r.top) / Math.max(1, r.height - vh * .35), 0, 1);
  const p = clamp((raw - .08) / .84, 0, 1);
  const sc = D.scenes[idx];
  return { idx, sc, t: sc.y0 + (sc.y1 - sc.y0) * p, p };
}
function tick(force) {
  const r = readScroll();
  if (r.idx !== lastActive) { steps.forEach((s, i) => s.classList.toggle("active", i === r.idx)); lastActive = r.idx; }
  const sc = r.sc;
  if (shown.flow !== sc.flow) shown.t = r.t;          // đổi chiều: đặt năm mới ngay, lớp mờ dần thay cho trượt
  const k = reduce || force ? 1 : .22;
  shown.t += (r.t - shown.t) * k; shown.p += (r.p - shown.p) * k;
  if (Math.abs(r.t - shown.t) < .002) shown.t = r.t;
  shown.flow = sc.flow;
  const s = { flow: sc.flow, t: shown.t, hl: sc.hl, ann: sc.ann, lines: !!sc.lines, p: sc.lines ? (sc.full ? 1 : shown.p) : 0 };
  race.update(s); lines.update(s);
  const lf = sc.lines ? "both" : sc.flow;
  if (lf !== legendFlow || force) { legend(document.getElementById("legend"), sc.lines ? "lines" : sc.flow); legendFlow = lf; }
  const live = T[lang].steps[r.idx].h;
  if (live !== lastLive) { document.getElementById("live").textContent = live; lastLive = live; }
}
let ticking = false;
function loop() { tick(false); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ---------------------------------------------------------------- free explorer below the story
const ex = (() => {
  const r2 = makeRace(document.getElementById("chart2"), document.getElementById("tip2"), document.getElementById("figwrap2"));
  const st = { flow: "X", t: Y0 };
  const slider = document.getElementById("yr"), out = document.getElementById("yrOut");
  function render() {
    r2.update({ flow: st.flow, t: st.t, hl: null, ann: st.flow === "M" ? "gap" : null, lines: false });
    out.textContent = Math.round(st.t);
    legend(document.getElementById("legend2"), st.flow);
    document.querySelectorAll("#flowSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.flow === st.flow));
    table();
  }
  function table() {
    const y = Math.round(st.t), i = y - Y0, tx = T[lang];
    const rows = D.flows[st.flow].partners.filter(p => p.rank[i] <= D.top).sort((a, b) => a.rank[i] - b.rank[i]);
    document.getElementById("tbl").innerHTML = "<caption class='sr'>" + tx.flowShort[st.flow] + " " + y + "</caption><tr><th>" + tx.rank + "</th><th>" + tx.partner +
      "</th><th>" + tx.group + "</th><th class='num'>% " + tx.flowShort[st.flow].toLowerCase() + " " + y + "</th></tr>" +
      rows.map(p => "<tr><td>" + p.rank[i] + "</td><td>" + nameOf(p) + "</td><td>" + groupName(p.group) + "</td><td class='num'>" + pct(p.share[i]) + "</td></tr>").join("");
  }
  slider.addEventListener("input", () => { stop(); st.t = +slider.value; render(); });
  document.querySelectorAll("#flowSeg button").forEach(b => b.addEventListener("click", () => { st.flow = b.dataset.flow; render(); }));
  let raf = null, last = 0;
  function frame(ts) {
    if (!last) last = ts;
    st.t = Math.min(Y1, st.t + (ts - last) / 900); last = ts;
    slider.value = Math.round(st.t); render();
    if (st.t >= Y1) { stop(); return; }
    raf = requestAnimationFrame(frame);
  }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = null; last = 0; playing = false; playBtn.textContent = T[lang].play; }
  playBtn.addEventListener("click", () => {
    if (playing) { stop(); return; }
    if (st.t >= Y1) st.t = Y0;
    playing = true; playBtn.textContent = T[lang].pause;
    if (reduce) { st.t = Y1; render(); stop(); return; }
    raf = requestAnimationFrame(frame);
  });
  return { render };
})();

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); } catch (e) {}
  applyText();
}));
applyText();
})();
</script>
</body>
